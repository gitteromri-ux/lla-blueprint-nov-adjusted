<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Masterclass Clips</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--ink:#1c1917;--mute:#78716c;--acc:#7a1f2b;--line:#e7e1d8}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{padding:56px 22px 8px;text-align:center}.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);font-weight:600}
header h1{font-family:'Playfair Display',serif;font-weight:500;font-size:clamp(30px,8vw,52px);margin-top:12px;line-height:1.1}
main{max-width:560px;margin:0 auto;padding:12px 18px 80px}
.clip{padding:44px 0;border-bottom:1px solid var(--line)}.clip:last-child{border:0}
.clip h2{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,7.5vw,42px);line-height:1.12;text-align:center;margin-bottom:24px;letter-spacing:-.01em}
.frame{position:relative;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 24px 60px -24px rgba(28,25,23,.45)}
.r9x16{max-width:400px;margin:0 auto}video{display:block;width:100%;height:auto;cursor:pointer}
.snd{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);border:0;border-radius:999px;padding:10px 18px;font:600 13px Inter,sans-serif;background:rgba(255,255,255,.92);color:var(--ink);backdrop-filter:blur(8px);cursor:pointer}
.snd.on{opacity:.55}
.dl{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.btn{flex:1 1 140px;max-width:240px;text-align:center;padding:14px 16px;border-radius:12px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.btn:first-child{background:var(--ink);color:#fff}.btn span{opacity:.6;font-weight:400;margin-left:4px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 0 40px}
</style></head><body><header><div class="eyebrow">Live Longer Academy · Masterclass</div><h1>Masterclass Clips</h1></header>

</main><footer>Clips produced in Riverside</footer>
<script>
document.querySelectorAll('.frame').forEach(f=>{const v=f.querySelector('video'),b=f.querySelector('.snd');
const t=()=>{const m=!v.muted;document.querySelectorAll('video').forEach(x=>{x.muted=true});document.querySelectorAll('.snd').forEach(x=>{x.textContent='🔇 Tap to unmute';x.classList.remove('on')});
if(!m){v.muted=false;v.play();b.textContent='🔊 Sound on';b.classList.add('on')}};b.onclick=t;v.onclick=t;});
</script></body></html>
